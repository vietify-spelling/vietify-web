<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vietify</title>
  <meta name="description" content="Give foreign pronunciation a Vietnamese-style spelling — in your browser.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div>
        <h1>Vietify</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
      <label class="ui-lang">
        <span class="sr-only" data-i18n="interface_language"></span>
        <select id="ui-language" aria-label="Interface language"></select>
      </label>
    </div>
  </header>

  <main class="wrap">
    <section class="card" aria-labelledby="text-heading">
      <div class="row-head">
        <h2 id="text-heading" data-i18n="text_heading"></h2>
        <button id="speak" class="icon-btn" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path id="speak-icon" fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
          <span id="speak-label"></span>
        </button>
      </div>

      <div id="drop" class="drop">
        <textarea id="text" rows="6" spellcheck="false" autocomplete="off" aria-labelledby="text-heading"></textarea>
        <div class="file-row">
          <span id="file-label" class="muted" data-i18n="drop_hint"></span>
          <span class="grow"></span>
          <input id="file" type="file" accept=".txt,text/plain" hidden>
          <button id="browse" type="button" class="btn" data-i18n="browse"></button>
          <button id="clear" type="button" class="btn" data-i18n="clear"></button>
        </div>
      </div>

      <div class="options">
        <div class="field">
          <label for="language" data-i18n="language"></label>
          <select id="language"></select>
        </div>
        <fieldset class="field">
          <legend data-i18n="output_mode"></legend>
          <div id="modes" class="modes"></div>
        </fieldset>
      </div>

      <div class="actions">
        <button id="convert" type="button" class="btn primary"><span data-i18n="convert"></span> <kbd data-i18n="convert_hint"></kbd></button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section id="results" class="results" aria-live="polite"></section>
    <section id="notes" class="notes" hidden></section>
  </main>

  <footer class="wrap foot">
    <p data-i18n="about"></p>
    <p><span data-i18n="credits"></span> <a href="NOTICE.txt" data-i18n="source"></a></p>
  </footer>

  <script type="module" src="js/ui/app.js"></script>
</body>
</html>
